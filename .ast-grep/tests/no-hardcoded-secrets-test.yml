# Issue #1: фикстуры для правила `no-hardcoded-secrets`.
#
# `valid` — код, который правило НЕ должно трогать; `invalid` — который обязано.
# Гоняется через `ast-grep test`. Фикстура вскрыла реальную дыру: одиночный
# паттерн `$FIELD = "$VALUE"` не матчил `let`-биндинг — теперь правило покрывает
# `let`/`const`/`static`/field-инициализатор.
id: no-hardcoded-secrets
valid:
  # Секрет приходит из env — так и надо.
  - |
    fn from_env() -> Result<String, std::env::VarError> {
        std::env::var("API_KEY")
    }
  # Явный плейсхолдер — правило не должно шуметь на примерах и документации.
  - |
    fn example() {
        let api_key = "example-placeholder-value";
    }
  # Длинное значение, но имя не похоже на секрет.
  - |
    fn not_a_secret() {
        let name = "abcdefghijklmnopqrst";
    }
invalid:
  # `let`-биндинг с ключом.
  - |
    fn leaked() {
        let api_key = "sk-abcdef1234567890abcdef";
    }
  # `const`.
  - |
    const API_KEY: &str = "sk-abcdef1234567890abcdef";
  # `static` с токеном.
  - |
    static TOKEN: &str = "ghp_abcdef1234567890abcdef";
  # Field-инициализатор структуры.
  - |
    fn build() {
        let cfg = Config { password: "hunter2hunter2hunter2" };
    }
