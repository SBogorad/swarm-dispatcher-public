# Issue #1: запрет `.unwrap()` в production-коде.
#
# Почему: `.unwrap()` паникует на `None`/`Err`, а паника в воркере/стороже —
# это потерянная аренда или упавший контур. В production нужен `.expect()` с
# понятным сообщением либо обработка ошибки.
#
# Область — только production-код (`**/src/**/*.rs`). Интеграционные тесты и
# примеры (`crates/*/tests/*.rs`, `crates/*/examples/*.rs`) — отдельные крейты,
# где `.unwrap()` нормален (падение теста = сигнал). Без `files:` правило
# давало 216 находок, из них 215 — в тестах/примерах (проверено на репозитории).
#
# Тест-модули ВНУТРИ `src` (`#[cfg(test)] mod tests { … }`) исключены отдельно:
# без этого правила не отличить тестовый модуль от production-функции.
#
# `stopBy: end` обязателен: `.unwrap()` лежит на несколько уровней глубже
# `mod_item` (внутри `fn`), а по умолчанию `inside` смотрит только на
# непосредственного родителя и не находит модуль.
id: no-unwrap-in-production
language: Rust
severity: warning
files:
  - "**/src/**/*.rs"
message: |
  `.unwrap()` в production-коде: паника вместо обработки.
  Используйте `.expect("почему это не может упасть")` или `?`.
  Для осознанного исключения добавьте строку `// ast-grep-ignore` выше.
note: Issue #1 — архитектурная проверка (ast-grep).
rule:
  pattern: $X.unwrap()
  not:
    inside:
      all:
        - kind: mod_item
        - follows:
            kind: attribute_item
            regex: "cfg\\(test\\)"
      stopBy: end
