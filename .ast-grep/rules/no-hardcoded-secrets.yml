# Issue #1: детект хардкода секретов.
#
# Почему: ключ/токен/пароль, вписанный строкой в код, попадает в git-историю
# навсегда. Секреты должны приходить из env (`.env`, `SecretRef`), а не из кода.
#
# Правило намеренно узкое: литерал длиной ≥16 символов, похожий на ключ.
# `format!`-строки и явные плейсхолдеры (example/placeholder/your-…) не ловим,
# иначе правило шумит на документации и тестовых значениях.
#
# Почему `any` из четырёх паттернов, а не один `$FIELD = "$VALUE"`: одиночный
# паттерн-присваивание НЕ матчит `let`-биндинг — реальная дыра, вскрытая
# фикстурой `.ast-grep/tests/no-hardcoded-secrets-test.yml`. Покрываем
# `let`, `const`, `static` и field-инициализатор структуры.
#
# `field_initializer` для последнего паттерна обязателен: без явного `kind`
# ast-grep отказывается собирать правило («Rule must specify a set of AST kinds»).
#
# ВНИМАНИЕ: `constraints` — top-level ключ рядом с `rule` (не внутри `rule`),
# иначе ast-grep не парсит файл и падает ВЕСЬ scan, а не одно правило.
id: no-hardcoded-secrets
language: Rust
severity: error
message: |
  Похоже на хардкод секрета (ключ/токен/пароль строкой).
  Читайте значение из env или SecretRef. Для примера используйте
  `example`/`placeholder`-значение. Осознанное исключение: `// ast-grep-ignore: no-hardcoded-secrets`.
note: Issue #1 — архитектурная проверка (ast-grep).
rule:
  any:
    - pattern: 'let $FIELD = "$VALUE"'
    - pattern: 'const $FIELD: $T = "$VALUE"'
    - pattern: 'static $FIELD: $T = "$VALUE"'
    - all:
        - kind: field_initializer
        - pattern: '$FIELD: "$VALUE"'
constraints:
  FIELD:
    regex: "(?i)(api_?key|secret|token|password|passwd|credential)"
  VALUE:
    regex: "^[A-Za-z0-9_\\-]{16,}$"
    not:
      regex: "(?i)(example|placeholder|your_|changeme|dummy|fake|redacted|xxx)"
