# Issue #1: `.map_err()` не должен молча терять исходную ошибку.
#
# Почему: `.map_err(|_| ...)` выбрасывает причину и оставляет в логе только
# верхнеуровневое сообщение. При разборе инцидента исходная ошибка (какой
# именно сбой) часто и есть ответ. Правило узкое — только ПОЛНОЕ отбрасывание
# (`|_|`); `.map_err(|e| …)` и `.map_err(Type::from)` контекст сохраняют.
#
# Легитимное исключение: `env::var(...).map_err(|_| "X required")` — у `VarError`
# ровно два варианта, и для отсутствующей переменной исходный текст («environment
# variable not found») не добавляет ничего к явному сообщению. Такие места
# помечены `// ast-grep-ignore`.
id: required-error-context
language: Rust
severity: warning
message: |
  `.map_err(|_| ...)` теряет исходную ошибку.
  Используйте `.map_err(|e| ...)`, чтобы сохранить причину, либо
  `// ast-grep-ignore`, если исходная ошибка не несёт информации.
note: Issue #1 — архитектурная проверка (ast-grep).
rule:
  pattern: $X.map_err(|_| $BODY)
