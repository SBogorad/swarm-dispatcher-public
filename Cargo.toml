[workspace]
resolver = "2"
members = [
    "crates/swarm-core",
    "crates/swarm-llm",
    "crates/swarm-watchdog",
    "crates/swarm-worker",
    "crates/swarm-cli",
    "crates/swarm-planner",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
license = "MIT"

[workspace.dependencies]
postgres = { version = "0.19", features = [
    "with-uuid-1",
    "with-serde_json-1",
] }
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
ctrlc = "3.4"
aws-config = "1"
aws-credential-types = "1"
aws-sdk-s3 = "1"
aws-types = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
