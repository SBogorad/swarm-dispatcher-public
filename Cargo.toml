[workspace]
resolver = "2"
members = [
    "crates/swarm-core",
    "crates/swarm-llm",
    "crates/swarm-watchdog",
    "crates/swarm-worker",
    "crates/swarm-cli",
    "crates/swarm-planner",
    "crates/swarm-reviewer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
license = "MIT"

[workspace.dependencies]
postgres = { version = "0.19", features = [
    "with-uuid-1",
    "with-serde_json-1",
] }
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.11"
ctrlc = "3.4"
aws-config = "1"
aws-credential-types = "1"
# Dependabot GHSA-82j2-j2ch-gfr8 / GHSA-xgp8-3hg3-c2mh / GHSA-965h-392x-2mh5.
# `default` у s3 включает фичу `rustls` → aws-smithy-runtime/tls-rustls →
# aws-smithy-http-client/legacy-rustls-ring → rustls 0.21 + rustls-webpki 0.101.7
# (в линии 0.101 патча нет: advisory требует >= 0.103.12).
# Современный TLS даёт `default-https-client` (rustls 0.23 + webpki 0.103),
# поэтому legacy выключаем — это ровно набор default минус `rustls`.
# Настройка на уровне workspace: `default-features = false` в члене workspace
# не отменяет дефолты, объявленные здесь.
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
] }
aws-types = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
