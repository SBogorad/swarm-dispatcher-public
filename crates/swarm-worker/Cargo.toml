[package]
name = "swarm-worker"
version.workspace = true
edition.workspace = true

[features]
# FIND-01: shell-tools были за feature-гейтом до закрытия F6/F7/F11/F12.
# Волна 5 закрыла все четыре — гейт снят, модули компилируются всегда.
# Feature оставлен пустым для обратной совместимости вызовов `--features shell-tools`.
default = []
shell-tools = []

[dependencies]
swarm-core = { path = "../swarm-core" }
swarm-llm = { path = "../swarm-llm" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
ctrlc = "3.4"
aws-config = { workspace = true }
aws-credential-types = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-types = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
# v0.4: аудит tool calls пишется отдельным соединением (§7).
postgres = { workspace = true }
uuid = { workspace = true }
chrono = { version = "0.4.45", features = ["serde"] }

[dev-dependencies]
postgres = { workspace = true }
uuid = { workspace = true }
swarm-planner = { path = "../swarm-planner" }

[[test]]
name = "worker_integration"
path = "tests/worker_integration.rs"

[[test]]
name = "worker_sandbox"
path = "tests/worker_sandbox.rs"

[[example]]
name = "agent_loop_demo"
path = "examples/agent_loop_demo.rs"
