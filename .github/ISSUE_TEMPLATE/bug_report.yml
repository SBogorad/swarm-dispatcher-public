name: Bug report
description: Something behaves differently than documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: check [docs/KNOWN_LIMITATIONS.md](https://github.com/xodapi/swarm-dispatcher-public/blob/main/docs/KNOWN_LIMITATIONS.md).
        Many surprising behaviours are documented, accepted limitations.

        For security issues do **not** use this form — see
        [SECURITY.md](https://github.com/xodapi/swarm-dispatcher-public/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Actual behaviour, as concretely as possible.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: And where that expectation comes from — docs, a test, an error message.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps. Include the SQL function or CLI command involved.
      placeholder: |
        1. docker compose up -d
        2. docker compose run --rm --no-deps cli swarm-cli seed
        3. ...
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit / version
      description: Output of `git rev-parse --short HEAD` or the release tag.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Watchdog, worker, or Postgres output. Remove credentials and DSNs before pasting.
      render: shell
    validations:
      required: false
