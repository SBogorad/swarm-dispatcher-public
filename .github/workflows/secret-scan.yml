name: secret-scan

# Защита от утечек секретов на push и PR.
#
# Два независимых слоя:
#   1) self-test сканера — доказывает, что `scripts/secret_scan.sh` краснеет
#      на фейк-секрете и НЕ даёт ложную блокировку без `.env*` (fail-closed).
#   2) pattern-scan диффа — ищет формы ключей/токенов/паролей в добавленных
#      строках. Работает без `.env`: в CI реальных значений нет по определению.
#
# Почему не только `secret_scan.sh <range>`: сканер сравнивает дифф с
# РЕАЛЬНЫМИ значениями из локального `.env*`. В CI такого файла нет, поэтому
# value-скан там всегда молчит (WARN, exit 0). Слой 2 закрывает эту дыру,
# слой 1 гарантирует, что сам сканер не сломан.
#
# GitHub Secret scanning + Push protection включаются в Settings репозитория
# (бесплатно на публичных) — они дополняют этот workflow провайдерскими
# паттернами (AWS, Stripe и т.д.), которых здесь нет.

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # нужен дифф BASE..HEAD

      - name: Scanner self-test (fail-closed)
        run: bash scripts/secret_scan.sh --self-test

      - name: Pattern scan of the diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          # Нулевой SHA — первый push ветки. Тогда база — общий предок с
          # дефолтной веткой (origin/HEAD -> main), иначе диапазон = вся история.
          if [[ "$BASE_SHA" =~ ^0+$ || -z "$BASE_SHA" ]]; then
            default_ref="$(git symbolic-ref --quiet --short refs/remotes/origin/HEAD || true)"
            [[ -n "$default_ref" ]] || default_ref="origin/main"
            BASE_SHA="$(git merge-base "$default_ref" "$HEAD_SHA")"
            echo "note: base resolved to merge-base $default_ref HEAD = $BASE_SHA"
          fi

          python3 - "$BASE_SHA" "$HEAD_SHA" <<'PY'
          import re
          import subprocess
          import sys

          base, head = sys.argv[1], sys.argv[2]

          # Только добавленные строки: удаление секрета не должно валить скан.
          diff = subprocess.run(
              ["git", "diff", "-U0", f"{base}..{head}"],
              capture_output=True, text=True, check=True,
          ).stdout

          PATTERNS = [
              ("openai/anthropic key", re.compile(r"\bsk-[A-Za-z0-9_\-]{20,}")),
              ("github token", re.compile(r"\b(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}|\bgithub_pat_[A-Za-z0-9_]{20,}")),
              ("slack token", re.compile(r"\bxox[baprs]-[A-Za-z0-9\-]{10,}")),
              ("google api key", re.compile(r"\bAIza[0-9A-Za-z_\-]{30,}")),
              ("private key", re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----")),
              ("jwt", re.compile(r"\beyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{5,}")),
              # Пароль-литерал в DSN: значение НЕ должно быть ${VAR} или плейсхолдером.
              ("literal password in dsn", re.compile(r"postgres(?:ql)?://[^:\s/]+:(?!\$\{)[^@\s/$]{6,}@")),
          ]

          # Плейсхолдеры, на которых правило не должно шуметь.
          ALLOW = re.compile(
              r"(?i)(example|placeholder|changeme|your[-_]|<[^>]+>|\$\{[^}]+\}|redacted|dummy|fake|hunter2)"
          )

          file = ""
          hits = []
          for line in diff.splitlines():
              if line.startswith("+++ b/"):
                  file = line[6:]
                  continue
              if not line.startswith("+") or line.startswith("+++"):
                  continue
              added = line[1:]
              if ALLOW.search(added):
                  continue
              for name, rx in PATTERNS:
                  for m in rx.finditer(added):
                      hits.append((file, name, m.group(0)[:40]))

          if hits:
              print("LEAK: подозрительные значения в добавленных строках:")
              for f, name, frag in hits:
                  # Фрагмент маскируем: не выводим секрет целиком в публичный лог.
                  masked = frag[:6] + "…" + frag[-4:] if len(frag) > 12 else "…"
                  print(f"  {f}: [{name}] {masked}")
              sys.exit(1)

          print(f"RESULT: PASS — паттерн-скан {base[:8]}..{head[:8]} чист")
          PY

      - name: Value scan against repository secrets (optional)
        # Если владелец добавил значения в Settings -> Secrets, сканер сверит
        # дифф с реальными ключами. Без секретов шаг честно пропускается.
        env:
          SECRET_ENV_DIR: ${{ github.workspace }}/.ci-env
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          # Значения из Settings -> Secrets and variables -> Actions.
          # Не заданы — шаг честно пропускается (не притворяется зелёным сканом).
          WORKER_LLM_API_KEY: ${{ secrets.WORKER_LLM_API_KEY }}
          BRIDGE_LLM_API_KEY: ${{ secrets.BRIDGE_LLM_API_KEY }}
          PLANNER_LLM_API_KEY: ${{ secrets.PLANNER_LLM_API_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$SECRET_ENV_DIR"
          wrote=0
          # Имена совпадают с локальными переменными .env.
          for name in WORKER_LLM_API_KEY BRIDGE_LLM_API_KEY PLANNER_LLM_API_KEY DB_PASSWORD; do
            val="${!name:-}"
            if [[ -n "$val" ]]; then
              printf '%s=%s\n' "$name" "$val" >> "$SECRET_ENV_DIR/.env"
              wrote=1
            fi
          done
          if ((wrote == 0)); then
            echo "SKIP: секреты репозитория не заданы — value-скан пропущен"
            exit 0
          fi
          if [[ "$BASE_SHA" =~ ^0+$ || -z "$BASE_SHA" ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          bash scripts/secret_scan.sh "$BASE_SHA..HEAD"
