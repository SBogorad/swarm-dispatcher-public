name: release-gate

# STRICT acceptance gate — mirrors scripts/acceptance_harness.sh --full-workspace-test.
# Runs on GitHub-hosted runners with a disposable PostgreSQL 16 service
# container; nothing persists between jobs.
#
# Cost note: this job is the only thing that consumes GitHub Actions minutes
# for this (private) repository. See docs/ci/CI_COST.md for the estimate and
# how to make it cheaper (path filters, fast lane, self-hosted runner).

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  gate:
    name: STRICT gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the harness diffs BASE..HEAD

      - name: Install Rust toolchain (MSRV 1.94.1)
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Issue #1: архитектурные проверки ast-grep (Rust AST, а не regexp).
      # Ставим ДО дорогой сборки, чтобы падать быстро. Версия зафиксирована
      # под локальную (0.50.0) — иначе правила/тесты могут разойтись с CI.
      # `test` проверяет сами правила по фикстурам, `scan --error` — код
      # репозитория (ненулевой код возврата при находках).
      - name: Install ast-grep (architecture checks, Issue #1)
        run: npm install -g @ast-grep/cli@0.50.0

      - name: Run ast-grep architecture checks
        run: |
          ast-grep test --skip-snapshot-tests
          ast-grep scan --error

      - name: Install uv (for pytest venv)
        uses: astral-sh/setup-uv@v7

      - name: Build sandbox image (agent-sandbox:1.85)
        run: docker build -t agent-sandbox:1.85 sandbox/

      # The harness provisions its OWN disposable database via `docker run`
      # (postgres:16-alpine) and removes it in an EXIT trap, so it needs a
      # Docker daemon — GitHub-hosted ubuntu runners provide one.
      - name: Run STRICT acceptance harness
        run: |
          bash scripts/acceptance_harness.sh \
            --base "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --branch HEAD \
            --full-workspace-test \
            --allowlist-file scripts/acceptance_allowlist.txt

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-logs-${{ github.run_id }}
          path: /tmp/swarm-dispatcher-acceptance/**
          if-no-files-found: ignore
          retention-days: 7

  mutations:
    name: mutation testing (Rust M1-M6 + SQL S1-S5)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Волна 5.2: мутационный прогон ОБЯЗАН быть в CI. Инцидент: скрипт
    # потерял `--ignored` (Docker/PG-тесты перестали запускаться), и без CI
    # 4 из 6 мутантов ложно «выжили» — дефект был найден только вручную.
    # Теперь выживший мутант валит CI.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (MSRV 1.94.1)
        uses: dtolnay/rust-toolchain@1.94.1

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build sandbox image (agent-sandbox:1.85)
        run: docker build -t agent-sandbox:1.85 sandbox/

      # Issue #21: SQL-мутации (S1-S5) требуют .venv/bin/python
      # (scripts/run_mutations_sql.sh:54). Джоб gate ставил uv, а здесь шага
      # не было — SQL-шаг падал с 'BLOCKED: .venv/bin/python not found',
      # и S1-S5 НИКОГДА не исполнялись в CI (красный на master).
      - name: Install uv and create pytest venv
        uses: astral-sh/setup-uv@v7

      - name: Create .venv for SQL mutation arbiters
        run: |
          uv venv --quiet .venv
          uv pip install --quiet --python .venv/bin/python pytest psycopg2-binary

      # Disposable PostgreSQL 16 (prefix v0 — скрипт сам проверяет
      # disposable-БД и fail-closed pre-conditions).
      - name: Provision disposable PostgreSQL 16
        run: |
          docker run -d --name mut_pg \
            -e POSTGRES_PASSWORD=pw -e POSTGRES_USER=swarm \
            -p 55440:5432 postgres:16-alpine
          # Гонка init: официальный entrypoint postgres:16-alpine на время
          # применения init-скриптов поднимает ВРЕМЕННЫЙ сервер только на
          # unix-socket, затем гасит его и стартует настоящий (TCP :5432).
          # `pg_isready` без `-h` отвечает на временном сервере → ложная
          # готовность, а следующий psql ловит 'database system is shutting
          # down' (дважды валил PR #44 не по коду). Ждём реальную БД запросом
          # `select 1` по TCP — ровно как acceptance_harness.sh (стр. 568).
          ready=0
          for i in $(seq 1 60); do
            if docker exec -e PGPASSWORD=pw mut_pg \
              psql -X -h 127.0.0.1 -U swarm -d postgres -c 'select 1' >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 1
          done
          ((ready == 1)) || { echo 'FATAL: mut_pg не поднялся за 60с'; docker logs mut_pg; exit 1; }
          docker exec -e PGPASSWORD=pw -i mut_pg psql -X -h 127.0.0.1 -U swarm -d postgres -c 'create database v0sandbox'
          docker exec -e PGPASSWORD=pw -i mut_pg psql -X -h 127.0.0.1 -U swarm -d v0sandbox < schema/schema_v0.sql

      - name: Run mutation testing (M1-M6 Rust, fail on survivors)
        env:
          TEST_DATABASE_URL: host=127.0.0.1 port=55440 user=swarm password=pw dbname=v0sandbox
          SANDBOX_IMAGE: agent-sandbox:1.85
        run: bash scripts/run_mutations_v04.sh

      # Волна 5.2: SQL-мутации ядра (S1-S5) — отдельный прогон, чтобы выживший
      # SQL-мутант валил CI так же, как Rust-мутант.
      - name: Run SQL mutation testing (S1-S5, fail on survivors)
        env:
          TEST_DATABASE_URL: host=127.0.0.1 port=55440 user=swarm password=pw dbname=v0sandbox
          PGDSN: host=127.0.0.1 port=55440 user=swarm password=pw dbname=v0sandbox
          W4_ADMIN_DSN: host=127.0.0.1 port=55440 user=swarm password=pw dbname=v0sandbox
          W4_W1_PW: c2_w1
          W4_W2_PW: c2_w2
        run: |
          # SQL-арбитры требуют только схему (функции), роли не нужны.
          bash scripts/run_mutations_sql.sh

      - name: Cleanup mutation database
        if: always()
        run: docker rm -f mut_pg || true
