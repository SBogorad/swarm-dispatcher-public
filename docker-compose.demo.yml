# Демонстрационный контур «Swarm Ops Console».
#
# Отдельный от docker-compose.yml (боевой контур не трогаем). Поднимает
# собственную БД со схемой swarm-dispatcher и на ней — кабину координации:
#   postgres       — схема v0 (единый источник истины) + demo/schema_extras.sql;
#   demo-bridge    — FastAPI: цель → граф задач, канбан/карточка/журнал (8080);
#   agent-1/2/3    — агенты-исполнители: забирают задачи по SQL-протоколу;
#   demo-reviewer  — строгий review-gate (F2);
#   demo-scheduler — promote_ready/reclaim_expired (сторож в миниатюре);
#   demo-ui        — Swarm Ops Console (Streamlit, 8501);
#   demo-init      — регистрация агентов и подготовка витрины.
#
# Запуск:  ./scripts/start_demo.sh
# Остановка: docker compose -f docker-compose.demo.yml down -v

name: swarm-demo

x-demo-env: &demo-env
  DEMO_DATABASE_URL: postgres://swarm:${DEMO_DB_PASSWORD:-swarm}@postgres:5432/swarm
  DEMO_ARTIFACTS_DIR: /artifacts
  DEMO_POLL_SEC: "1.0"
  DEMO_LEASE_SEC: "120"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: swarm
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:-swarm}
      POSTGRES_DB: swarm
    volumes:
      - demo_pg:/var/lib/postgresql/data
      - ./schema/schema_v0.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./demo/schema_extras.sql:/docker-entrypoint-initdb.d/02_extras.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarm -d swarm"]
      interval: 3s
      timeout: 3s
      retries: 20

  demo-bridge:
    build: {context: ., dockerfile: demo/Dockerfile}
    command: ["uvicorn", "bridge.api:app", "--host", "0.0.0.0", "--port", "8080"]
    environment: *demo-env
    ports:
      - "${DEMO_API_PORT:-8080}:8080"
    volumes:
      - demo_artifacts:/artifacts
    depends_on:
      postgres: {condition: service_healthy}

  agent-1:
    build: {context: ., dockerfile: demo/Dockerfile}
    command: ["python", "engine/worker.py"]
    environment:
      <<: *demo-env
      DEMO_WORKER_ID: agent_w1
    volumes:
      - demo_artifacts:/artifacts
    depends_on:
      postgres: {condition: service_healthy}

  agent-2:
    build: {context: ., dockerfile: demo/Dockerfile}
    command: ["python", "engine/worker.py"]
    environment:
      <<: *demo-env
      DEMO_WORKER_ID: agent_w2
    volumes:
      - demo_artifacts:/artifacts
    depends_on:
      postgres: {condition: service_healthy}

  agent-3:
    build: {context: ., dockerfile: demo/Dockerfile}
    command: ["python", "engine/worker.py"]
    environment:
      <<: *demo-env
      DEMO_WORKER_ID: agent_w3
    volumes:
      - demo_artifacts:/artifacts
    depends_on:
      postgres: {condition: service_healthy}

  demo-reviewer:
    build: {context: ., dockerfile: demo/Dockerfile}
    command: ["python", "engine/reviewer.py"]
    environment:
      <<: *demo-env
      DEMO_REVIEWER_ID: agent_reviewer
    volumes:
      - demo_artifacts:/artifacts
    depends_on:
      postgres: {condition: service_healthy}

  demo-scheduler:
    build: {context: ., dockerfile: demo/Dockerfile}
    command: ["python", "engine/scheduler.py"]
    environment: *demo-env
    depends_on:
      postgres: {condition: service_healthy}

  demo-ui:
    build: {context: ., dockerfile: demo/Dockerfile}
    command: ["streamlit", "run", "ui/app.py",
              "--server.port=8501", "--server.address=0.0.0.0",
              "--server.headless=true", "--browser.gatherUsageStats=false"]
    environment:
      DEMO_API_URL: http://demo-bridge:8080
    ports:
      - "${DEMO_UI_PORT:-8501}:8501"
    depends_on:
      - demo-bridge

  # Одноразовая подготовка: регистрация агентов, чтобы панель узлов не пустовала.
  demo-init:
    build: {context: ., dockerfile: demo/Dockerfile}
    command: ["python", "-c", "from db import client as db; [db.register_worker(w) for w in ('agent_w1','agent_w2','agent_w3')]; print('[init] агенты зарегистрированы')"]
    environment: *demo-env
    restart: "no"

volumes:
  demo_pg:
  demo_artifacts:
